<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle (gradient) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Open book -->
  <path d="M100 180 Q 200 150 256 180 Q 312 150 412 180 L412 360 Q 312 330 256 360 Q 200 330 100 360 Z" fill="url(#book)" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/>
  <!-- Book spine -->
  <path d="M256 180 L256 360" stroke="#f59e0b" stroke-width="4"/>

  <!-- Left page lines -->
  <line x1="140" y1="220" x2="240" y2="220" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="248" x2="230" y2="248" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="276" x2="240" y2="276" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="304" x2="220" y2="304" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Right page lines -->
  <line x1="272" y1="220" x2="372" y2="220" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="272" y1="248" x2="380" y2="248" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="272" y1="276" x2="370" y2="276" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="272" y1="304" x2="360" y2="304" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Letter "প" in the middle, golden color -->
  <text x="256" y="145" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, Arial" font-size="72" font-weight="900" fill="url(#accent)">প</text>

  <!-- Graduation cap corner -->
  <path d="M370 130 L430 150 L370 170 L310 150 Z" fill="url(#accent)"/>
  <path d="M430 150 L430 180" stroke="#b45309" stroke-width="3"/>
  <circle cx="430" cy="183" r="5" fill="#b45309"/>

  <!-- Small sparkle -->
  <path d="M145 120 L150 110 L155 120 L165 125 L155 130 L150 140 L145 130 L135 125 Z" fill="#fbbf24"/>
</svg>
