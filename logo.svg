<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ecfdf5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background with soft feel -->
  <rect x="26" y="26" width="460" height="460" rx="110" ry="110" fill="url(#bg)"/>
  <!-- Inner border ring -->
  <rect x="50" y="50" width="412" height="412" rx="95" ry="95" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Open book (pages) -->
  <path d="M95 200 Q 200 170 256 200 Q 312 170 417 200 L417 370 Q 312 340 256 370 Q 200 340 95 370 Z"
        fill="url(#page)" stroke="#047857" stroke-width="3" stroke-linejoin="round"/>
  <!-- Spine -->
  <path d="M256 200 L256 370" stroke="#f59e0b" stroke-width="4"/>

  <!-- Left page lines (simple, clean) -->
  <line x1="135" y1="240" x2="235" y2="240" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="268" x2="228" y2="268" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="296" x2="235" y2="296" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="324" x2="215" y2="324" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Right page lines -->
  <line x1="277" y1="240" x2="377" y2="240" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="268" x2="382" y2="268" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="296" x2="368" y2="296" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="277" y1="324" x2="355" y2="324" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- "স" (সহজ) letter in Bengali, centered, warm golden -->
  <text x="256" y="160" text-anchor="middle" font-family="Hind Siliguri,Noto Sans Bengali,Arial,sans-serif" font-size="74" font-weight="900" fill="url(#gold)">স</text>

  <!-- Decorative check-mark (tick) bottom-right for "easy/correct" -->
  <path d="M372 360 L398 386 L435 340" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Tiny sparkle top-left -->
  <path d="M120 108 L126 93 L132 108 L147 114 L132 120 L126 135 L120 120 L105 114 Z" fill="#fde047"/>
</svg>
