<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>পড়াশুনা — তৃতীয় শ্রেণীর শিক্ষা সহায়িকা</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --primary:#0f766e;
    --primary-dark:#115e59;
    --accent:#f59e0b;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --danger:#ef4444;
    --success:#16a34a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.1);}
  .nav-wrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .logo{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .logo-mark{width:34px;height:34px;background:var(--accent);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#000;}
  nav{display:flex;gap:6px;flex-wrap:wrap;}
  nav a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:500;transition:.2s;font-size:15px;cursor:pointer;}
  nav a:hover{background:rgba(255,255,255,.15);}
  nav a.active{background:var(--accent);color:#000;font-weight:600;}
  main{max-width:1100px;margin:24px auto;padding:0 16px 80px;}
  .card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.05);border:1px solid var(--border);margin-bottom:20px;}
  h1,h2,h3{margin-top:0;}
  h1{font-size:28px;color:var(--primary-dark);}
  h2{font-size:22px;color:var(--primary-dark);}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
  .tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.2s;text-decoration:none;color:var(--text);display:block;}
  .tile:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(15,118,110,.15);border-color:var(--primary);}
  .tile .icon{font-size:34px;margin-bottom:8px;}
  .tile .title{font-size:18px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;}
  .tile .desc{font-size:13px;color:var(--muted);}
  .breadcrumb{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .breadcrumb a{color:var(--primary);text-decoration:none;cursor:pointer;}
  .breadcrumb span{margin:0 6px;}
  .btn{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;transition:.2s;font-family:inherit;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.accent{background:var(--accent);color:#000;}
  .btn.danger{background:var(--danger);}
  .btn.play{background:transparent;color:var(--primary);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:16px;cursor:pointer;}
  .btn.play:hover{background:#ecfdf5;}
  .btn.play.small{padding:4px 8px;font-size:14px;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  textarea,input[type=text],select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;resize:vertical;}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15);}
  .chapter{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .chapter-head{padding:12px 16px;background:#f1f5f9;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:10px;}
  .chapter-head:hover{background:#e2e8f0;}
  .chapter-body{padding:16px;display:none;line-height:1.9;white-space:pre-wrap;font-size:16px;}
  .chapter.open .chapter-body{display:block;}
  .chapter.open .arrow{transform:rotate(90deg);}
  .arrow{transition:.2s;}
  .q-block{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fafafa;display:flex;gap:12px;align-items:flex-start;}
  .q-block .chk{margin-top:4px;width:20px;height:20px;cursor:pointer;accent-color:var(--success);flex-shrink:0;}
  .q-block .q-content{flex:1;min-width:0;}
  .q{font-weight:600;color:#b45309;margin-bottom:8px;display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap;}
  .a{line-height:1.8;color:#1e293b;margin-top:6px;display:flex;align-items:flex-start;gap:8px;}
  .bookmark-btn{float:right;background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);}
  .bookmark-btn.active{color:var(--accent);}
  .hero{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:30px;border-radius:16px;margin-bottom:20px;}
  .hero h1{color:#fff;font-size:30px;margin:0 0 8px;}
  .hero p{opacity:.9;margin:0;font-size:16px;}
  .tag{display:inline-block;background:#ecfdf5;color:var(--primary-dark);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-right:6px;}
  .answer-box{background:#ecfdf5;border-left:4px solid var(--primary);padding:14px 16px;border-radius:8px;margin-top:12px;line-height:1.9;}
  .ai-answer{background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:4px solid var(--accent);padding:18px;border-radius:10px;margin-top:12px;line-height:1.9;position:relative;}
  .ai-badge{display:inline-block;background:var(--accent);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-right:8px;}
  .voice-indicator{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;margin-right:6px;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .footer{text-align:center;padding:20px;color:var(--muted);font-size:13px;}
  .empty{text-align:center;padding:40px;color:var(--muted);}
  .lesson-meta{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .book-group{margin-bottom:18px;}
  .book-group h3{color:var(--primary-dark);border-bottom:2px solid var(--border);padding-bottom:6px;display:flex;align-items:center;gap:8px;}
  .count-badge{background:var(--primary);color:#fff;font-size:12px;padding:2px 10px;border-radius:12px;font-weight:600;}
  .search-filter{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
  .playing{background:#fef3c7!important;box-shadow:0 0 0 3px rgba(245,158,11,.4);}
  .loading{color:var(--muted);font-style:italic;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin:0 2px;animation:bounce 1.4s infinite ease-in-out both;}
  .dot:nth-child(1){animation-delay:-0.32s;}
  .dot:nth-child(2){animation-delay:-0.16s;}
  @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
  @media (max-width:600px){
    .hero h1{font-size:22px;}
    nav a{padding:6px 10px;font-size:13px;}
    .logo{font-size:18px;}
  }
</style>
</head>
<body>

  <div class="nav-wrap">
    <div class="logo" onclick="route('#/')">

          <path d="M256 200 L256 345" stroke="#0f766e" stroke-width="4"/>

    <nav>

      <a onclick="route('#/bookmarks')" data-route="/bookmarks">চিহ্নিত পড়া <span id="bm-count" style="background:var(--accent);color:#000;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:3px;"></span></a>

</header>
<main id="app"></main>
<div class="footer">© পড়াশুনা — শিক্ষা সবার জন্য</div>

<script src="bangla-data.js"></script>
<script>
/* =============== ডেটাসেট =============== */
const SUBJECTS = [
  {id:"bangla",  name:"বাংলা",             icon:"📖", color:"#dc2626", loaded:true},
  {id:"english", name:"ইংরেজি",            icon:"🔤", color:"#2563eb", loaded:false},
  {id:"math",    name:"গণিত",              icon:"🔢", color:"#16a34a", loaded:false},
  {id:"islam",   name:"ইসলাম শিক্ষা",      icon:"🕌", color:"#059669", loaded:false},
  {id:"primary", name:"প্রাথমিক জ্ঞান",    icon:"🌱", color:"#d97706", loaded:false},
  {id:"bgs",     name:"বাংলাদেশ ও বিশ্বপরিচয়", icon:"🌍", color:"#7c3aed", loaded:false},
];

const PLACEHOLDER = {title:"[শীঘ্রই সংযোজন করা হবে]",chapters:[{title:"অপেক্ষা করুন",body:"এই বইটি শীঘ্রই যুক্ত করা হবে। দয়া করে .txt ফাইল পাঠান।"}],solutions:[]};
function getBookContent(subj){ return (subj==="bangla" && window.BANGLA_BOOK) ? BANGLA_BOOK : PLACEHOLDER; }
function getSolutions(subj){ return getBookContent(subj).solutions || []; }

/* =============== চিহ্নিত (টিক চিহ্ন) স্টোরেজ =============== */
const CK_KEY = "checked_reads";
function getChecked(){ try{return JSON.parse(localStorage.getItem(CK_KEY)||"{}");}catch(e){return {};} }
function setChecked(d){ localStorage.setItem(CK_KEY, JSON.stringify(d)); }
function toggleCheck(subj, key, qtext){
  const d = getChecked();
  if(!d[subj]) d[subj] = {};
  if(d[subj][key]) delete d[subj][key];
  else d[subj][key] = {q:qtext, time:new Date().toISOString()};
  setChecked(d);
  updateBmCount();
}
function isChecked(subj, key){ const d=getChecked(); return !!(d[subj] && d[subj][key]); }
function uncheck(subj, key){ const d=getChecked(); if(d[subj] && d[subj][key]){delete d[subj][key]; setChecked(d); updateBmCount();} }
function countChecked(){ const d=getChecked(); let n=0; Object.keys(d).forEach(s=>n+=Object.keys(d[s]||{}).length); return n; }
function updateBmCount(){
  const n = countChecked();
  const el = document.getElementById("bm-count");
  if(el) el.textContent = n>0 ? n : "";
}

/* =============== বুকমার্ক (★) স্টোরেজ =============== */
function getBookmarks(){ try{return JSON.parse(localStorage.getItem("bookmarks")||"[]");}catch(e){return[];} }
function setBookmarks(b){ localStorage.setItem("bookmarks",JSON.stringify(b)); }
function toggleBookmark(id, text){
  const b = getBookmarks(); const i=b.findIndex(x=>x.id===id);
  if(i>=0)b.splice(i,1); else b.push({id,text,time:new Date().toISOString()});
  setBookmarks(b);
}
function isBookmarked(id){ return getBookmarks().some(x=>x.id===id); }

/* =============== TTS — উচ্চস্বরে পড়া (মহিলা কন্ঠ) =============== */
let currentUtter = null;
let currentBtn = null;
function getFemaleVoice(){
  const voices = speechSynthesis.getVoices();
  // বাংলা মহিলা কন্ঠ খুঁজি
  let bn = voices.filter(v=>v.lang.toLowerCase().startsWith("bn"));
  // Female নির্দেশক শব্দ থাকলে
  let female = bn.find(v=>/female|woman|মহিলা|bangla.*female|bn.*female/i.test(v.name));
  if(female) return female;
  // যেকোনো বাংলা female (কখনো কখনো "Kalpana", "Bengali (India) Female")
  female = bn.find(v=>!/male|পুরুষ/i.test(v.name));
  if(female) return female;
  // প্রথম বাংলা voice
  if(bn[0]) return bn[0];
  // English female fallback
  return voices.find(v=>v.lang.startsWith("en") && /female/i.test(v.name)) || voices[0];
}
// voices লোড হওয়ার জন্য
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = ()=>{};
}
function speak(text, btn){
  if(!("speechSynthesis" in window)){ alert("😕 আপনার ব্রাউজার পড়ে শোনানো সমর্থন করে না।"); return; }
  stopSpeaking();
  if(!text || !text.trim()) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "bn-BD";
  u.rate = 0.95;
  u.pitch = 1.1;
  const v = getFemaleVoice();
  if(v){ u.voice = v; u.lang = v.lang; }
  u.onstart = ()=>{ currentUtter=u; if(btn){btn.classList.add("playing"); currentBtn=btn;} };
  u.onend = ()=>{ stopSpeaking(); };
  u.onerror = ()=>{ stopSpeaking(); };
  speechSynthesis.speak(u);
}
function stopSpeaking(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(currentBtn){currentBtn.classList.remove("playing"); currentBtn=null;}
  currentUtter=null;
}
function playButton(text, small=false){
  return `<button class="btn play ${small?'small':''}" onclick="event.stopPropagation();speak(this.dataset.t,this)" data-t="${text.replace(/"/g,'&quot;')}" title="পড়ে শুনুন">🔊</button>`;
}

/* =============== রাউটার =============== */
const app = document.getElementById("app");
function route(hash){ window.location.hash = hash; }

function getPathParts(){
  const hash = window.location.hash || "#/";
  const [p, q] = hash.replace(/^#/,"").split("?");
  return {parts: (p||"/").split("/").filter(Boolean), params: new URLSearchParams(q||"")};
}

function render(){
  stopSpeaking();
  const {parts, params} = getPathParts();
  const hash = window.location.hash || "#/";
  document.querySelectorAll("nav a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route && hash.startsWith("#"+a.dataset.route));
  });
  window.scrollTo(0,0);
  updateBmCount();
  try{
    if(parts.length===0) return renderHome();
    if(parts[0]==="search") return renderSearch();
    if(parts[0]==="bookmarks") return renderBookmarks();
    if(parts[0]==="classes") return renderClasses();
    if(parts[0]==="class" && parts[1]==="3"){
      if(parts[2]==="book") return renderSubjectList("book");
      if(parts[2]==="solution") return renderSubjectList("solution");
      return renderClass3();
    }
    if(parts[0]==="book" && parts[1]) return renderBook(parts[1]);
    if(parts[0]==="solution" && parts[1]) return renderSolution(parts[1]);
  }catch(err){
    app.innerHTML = `<div class="card"><h2>ত্রুটি</h2><p>${err.message}</p></div>`;
    return;
  }
  app.innerHTML = `<div class="card empty"><h2>৪০৪ — পাওয়া যায়নি</h2><p>পেজটি খুঁজে পাওয়া যায়নি।</p><button class="btn" onclick="route('#/')">হোমে ফিরুন</button></div>`;
}
window.addEventListener("hashchange", render);
window.addEventListener("load", ()=>{
  // Voice list লোড করানো
  if("speechSynthesis" in window){ speechSynthesis.getVoices(); }
  render();
});

/* =============== পেজ রেন্ডারার =============== */
function renderHome(){
  app.innerHTML = `
    <div class="hero">
      <h1>স্বাগতম পড়াশুনায়! 📚</h1>
      <p>তৃতীয় শ্রেণীর সব বই, সমাধান, AI সার্চ ও অডিও — সবকিছু এক জায়গায়।</p>
      <div style="margin-top:14px;">
        <span class="tag">বাংলা বই সম্পূর্ণ ✅</span>
        <span class="tag">টিক চিহ্নিত করা ⭐</span>
        <span class="tag">AI উত্তর 🤖</span>
        <span class="tag">মহিলা কন্ঠে 🔊</span>
      </div>
    </div>
    <div class="grid grid-2">
      <a class="tile" onclick="route('#/classes')">
        <div class="icon">🏫</div>
        <div class="title">শ্রেণী পাঠ</div>
        <div class="desc">তৃতীয় শ্রেণীর বই ও সমাধান পড়ুন</div>
      </a>
      <a class="tile" onclick="route('#/search')">
        <div class="icon">🔍</div>
        <div class="title">খুঁজুন (AI)</div>
        <div class="desc">লিখে বা ভয়েসে প্রশ্ন করুন, AI উত্তর দেবে ও পড়ে শুনাবে</div>
      </a>
      <a class="tile" onclick="route('#/bookmarks')">
        <div class="icon">✅</div>
        <div class="title">চিহ্নিত পড়া</div>
        <div class="desc">টিক দিয়ে চিহ্নিত প্রশ্নগুলো এখানে পাবেন</div>
      </a>
      <a class="tile" onclick="route('#/book/bangla')">
        <div class="icon">📖</div>
        <div class="title">আমার বাংলা বই</div>
        <div class="desc">সম্পূর্ণ বাংলা বই (পাঠ+শব্দ শিখি+অনুশীলনী)</div>
      </a>
    </div>
    <div class="card">
      <h2>📝 নতুন ফিচার</h2>
      <ul style="line-height:1.9">
        <li>✅ <strong>টিক চিহ্নিতকরণ:</strong> সমাধান পেজে প্রতিটি প্রশ্নের বাম পাশে চেকবক্সে টিক দিয়ে প্রশ্ন চিহ্নিত করুন; সব চিহ্নিত প্রশ্ন 'চিহ্নিত পড়া' মেনুতে বইভিত্তিক সাজানো থাকবে। টিক তুললে বাদ যাবে।</li>
        <li>🤖 <strong>AI উত্তর:</strong> খুঁজুন পেজে প্রশ্ন করলে বই থেকে প্রাসঙ্গিক তথ্য নিয়ে AI সুন্দর উত্তর তৈরি করে দেবে।</li>
        <li>🔊 <strong>পড়ে শুনানো:</strong> বাংলাদেশি মহিলা কন্ঠে উত্তর ও প্রতিটি প্রশ্ন-উত্তরের পাশে 🔊 বাটন।</li>
      </ul>
    </div>`;
}

function renderClasses(){
  app.innerHTML = `
    <div class="breadcrumb"><a onclick="route('#/')">হোম</a><span>›</span>শ্রেণী পাঠ</div>
    <div class="card"><h1>🏫 শ্রেণী পাঠ</h1><p style="color:var(--muted)">একটি শ্রেণী বেছে নিন:</p></div>
    <div class="grid grid-3">
      <a class="tile" onclick="route('#/class/3')"><div class="icon">3️⃣</div><div class="title">তৃতীয় শ্রেণী</div><div class="desc">মূল বই ও সমাধান</div></a>
      ${[4,5].map(n=>`<div class="tile" style="opacity:.5;cursor:not-allowed;"><div class="icon">${n}️⃣</div><div class="title">${n==4?"চতুর্থ":"পঞ্চম"} শ্রেণী</div><div class="desc">শীঘ্রই আসছে</div></div>`).join("")}
    </div>`;
}

/* AI-এর মতো উত্তর তৈরি: প্রসঙ্গ সংগ্রহ + sentence ranking + সুগঠিত জবাব */
function runAIAnswer(){
  const q = document.getElementById("qInput").value.trim();
  const bookId = document.getElementById("bookSelect").value;
  const box = document.getElementById("result");
  box.innerHTML = `<div class="ai-answer"><span class="ai-badge">AI</span> উত্তর তৈরি করছে <span class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>`;

  setTimeout(()=>{
    const ans = generateAIAnswer(q, bookId);
    const subj = SUBJECTS.find(s=>s.id===(bookId==="all"?"bangla":bookId));

    const name = subj ? subj.name : "সব বই";

    box.innerHTML = `
      <h2>🤖 AI-এর উত্তর</h2>
      <div class="ai-answer">
        <div style="margin-bottom:10px;">

        </div>

        ${ans.sources.length?`<div style="margin-top:14px;padding-top:10px;border-top:1px dashed #f59e0b;font-size:13px;color:#92400e;">
          <strong>📚 তথ্যসূত্র:</strong>
          <ul style="margin:6px 0 0 20px;padding:0;">${ans.sources.map(src=>`<li>${escapeHtml(src)}</li>`).join("")}</ul>
        </div>`:""}
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" onclick="speak(this.dataset.t)" data-t="">🔊 মহিলা কন্ঠে শুনুন</button>
        <button class="btn secondary" onclick="stopSpeaking()">থামান</button>
      </div>`;
    // অটো-স্পিচ নেই — ব্যবহারকারী বাটনে ক্লিক করলেই শুনতে পাবে
    document.querySelector('#result [data-t]').dataset.t = ans.text;
  }, 600);
}

function tokenize(text){
  return text.toLowerCase().replace(/[।,.!?\(\)0-9০-৯—\-\n\r\t]/g," ").split(/\s+/).filter(w=>w.length>1);
}

function generateAIAnswer(q, bookId){
  const qTokens = tokenize(q);
  const candidates = [];
  const booksToSearch = bookId==="all" ? SUBJECTS.filter(s=>s.loaded).map(s=>s.id) : [bookId];

  booksToSearch.forEach(sid=>{
    const book = getBookContent(sid);
    const s = SUBJECTS.find(x=>x.id===sid);
    // Solutions
    (book.solutions||[]).forEach((sol,i)=>{
      const text = sol.q + " " + sol.a;
      const score = scoreText(qTokens, tokenize(text));
      candidates.push({score: score+3, source:`${s.icon} ${s.name} (সমাধান)`, title:sol.q, text:sol.a, book:sid});
    });
    // Chapters — sentences
    book.chapters.forEach((ch,ci)=>{
      const sents = ch.body.split(/(?<=[।!?])\s+/);
      sents.forEach((sent,si)=>{
        // Add context: previous + next sentence
        const ctx = sents.slice(Math.max(0,si-1), Math.min(sents.length, si+2)).join(" ");
        const score = scoreText(qTokens, tokenize(sent+" "+ctx));
        if(score>0){
          candidates.push({score, source:`${s.icon} ${s.name} — ${ch.title}`, title:ch.title, text:sent.trim(), ctx:ctx, book:sid});
        }
      });
      // Whole chapter
      const wholeScore = scoreText(qTokens, tokenize(ch.title+" "+ch.body));
      if(wholeScore>10){
        candidates.push({score:wholeScore*0.7, source:`${s.icon} ${s.name} — ${ch.title} (অধ্যায়)`, title:ch.title, text:`${ch.title} সম্পর্কে বিস্তারিত: ${ch.body.slice(0,600)}...`, book:sid});
      }
    });
  });

  candidates.sort((a,b)=>b.score-a.score);
  const top = candidates.slice(0,4);

  if(top.length===0 || top[0].score<1){
    return {text:`দুঃখিত, আপনার প্রশ্নের সাথে মিলে যাওয়া তথ্য বইগুলোতে পাওয়া যায়নি।\n\n💡 অন্যভাবে প্রশ্নটা লিখে চেষ্টা করুন — সম্ভবত প্রশ্নটির ভিন্ন শব্দ ব্যবহার করলে উত্তর পাওয়া যাবে।\n\nউদাহরণ:\n• "পিঁপড়া কী করছিল?"\n• "২১শে ফেব্রুয়ারি কী"\n• "রবীন্দ্রনাথের বিজ্ঞান শিক্ষকের নাম"`, sources:[]};
  }

  // AI-স্টাইলে উত্তর সাজানো
  let intro = "";
  if(matchesAny(qTokens, ["কে","কার","কে?"])) intro = "আপনার প্রশ্নের উত্তর: ";
  else if(matchesAny(qTokens, ["কী","কি","কোন"])) intro = "জানা যায় যে, ";
  else if(matchesAny(qTokens, ["কেন","কেন?"])) intro = "কারণ হলো: ";
  else if(matchesAny(qTokens, ["কখন","কবে","সাল","তারিখ"])) intro = "সময়টি হলো: ";
  else if(matchesAny(qTokens, ["কোথায়","কোথা"])) intro = "অবস্থানটি হলো: ";
  else intro = "";

  // Combine best answers
  let main = "";
  const seen = new Set();
  const sources = [];
  top.forEach((t,i)=>{
    const clean = t.text.replace(/\s+/g," ").trim();
    if(clean.length<10) return;
    if(seen.has(clean.slice(0,40))) return;
    seen.add(clean.slice(0,40));
    if(i===0) main += (intro?intro:"") + clean;
    else main += " " + clean;
    if(t.source && !sources.includes(t.source)) sources.push(t.source);
    if(main.length>700) return;
  });

  if(!/[।!?]$/.test(main.trim())) main += "।";

  return {text:main.trim(), sources:sources.slice(0,3)};
}

function scoreText(qTokens, textTokens){
  if(qTokens.length===0) return 0;
  let s=0; let matched=0;
  const tokenSet = new Set(textTokens);
  qTokens.forEach(w=>{
    if(tokenSet.has(w)){ s+=w.length*2; matched++; }
    else {
      // partial match
      for(const wt of tokenSet){
        if(wt.length>3 && (wt.includes(w)||w.includes(wt))){ s+=w.length*0.5; break;}
      }
    }
  });
  // Bonus if many query words matched
  if(matched===qTokens.length) s += 5;
  if(matched>=Math.ceil(qTokens.length*0.7)) s+=2;
  return s;
}
function matchesAny(tokens, arr){ return tokens.some(t=>arr.some(a=>t.includes(a)||a.includes(t))); }

/* =============== ভয়েস রিকগনিশন =============== */
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){alert("😕 আপনার ব্রাউজার ভয়েস ইনপুট সমর্থন করে না। Chrome ব্যবহার করুন।");return;}
  if(isListening){recognition.stop();return;}
  recognition = new SR();
  recognition.lang="bn-BD";
  recognition.interimResults=false;
  recognition.onstart=()=>{isListening=true;document.getElementById("micIcon").innerHTML='<span class="voice-indicator"></span>';document.getElementById("micText").innerText="শুনছে...";};
  recognition.onresult=e=>{document.getElementById("qInput").value=e.results[0][0].transcript;};
  recognition.onerror=e=>{alert("ভয়েস শনাক্তকরণে সমস্যা: "+e.error);};
  recognition.onend=()=>{isListening=false;document.getElementById("micIcon").innerText="🎤";document.getElementById("micText").innerText="ভয়েস দিন";};
  recognition.start();
}
